<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap');

  :root{
    --bg:#0e0d0b;
    --paper:#17150f;
    --line:#2a271e;
    --ink:#ece7da;
    --ink-dim:#a39c8a;
    --ink-faint:#6b6558;
    --accent:#c9a15a;   /* aged brass — receipt-stamp gold */
    --good:#7a9b76;     /* checked / bought */
    --danger:#b3624f;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;}
  body{
    min-height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header{
    padding:28px 20px 14px;
    border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--bg); z-index:5;
  }
  h1{
    font-family:'Cormorant Garamond',serif; font-weight:600; font-style:italic;
    font-size:32px; margin:0 0 2px; letter-spacing:.3px; color:var(--ink);
  }
  .sub{font-size:12px; color:var(--ink-faint); letter-spacing:.08em; text-transform:uppercase;}

  /* running total — the receipt tape */
  .tape{
    display:flex; justify-content:space-between; align-items:baseline;
    margin-top:14px; padding-top:12px; border-top:1px dashed var(--line);
  }
  .tape .label{font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint);}
  .tape .amount{font-family:'DM Mono',monospace; font-size:22px; color:var(--accent);}
  .tape .count{font-family:'DM Mono',monospace; font-size:11px; color:var(--ink-faint);}

  .navrow{text-align:center; margin-top:10px;}
  .navlink{
    font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--ink-dim); cursor:pointer; border-bottom:1px solid var(--line); padding-bottom:2px;
  }
  .navlink:active{color:var(--accent); border-color:var(--accent);}

  main{padding:14px 20px 140px;}

  .store-group{margin-top:22px;}
  .store-group:first-child{margin-top:16px;}
  .store-name{
    font-family:'DM Mono',monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
    color:var(--ink-faint); margin-bottom:8px; display:flex; align-items:center; gap:8px;
  }
  .store-name::after{content:''; flex:1; height:1px; background:var(--line);}

  .item{
    background:var(--paper); border:1px solid var(--line); border-radius:10px;
    padding:12px 12px; margin-bottom:8px; display:flex; align-items:flex-start; gap:12px;
    transition:opacity .2s, transform .2s;
  }
  .item.bought{opacity:.45;}
  .item.bought .name{text-decoration:line-through; text-decoration-color:var(--ink-faint);}

  .check{
    width:22px; height:22px; border-radius:50%; border:1.5px solid var(--ink-faint);
    flex-shrink:0; margin-top:2px; display:flex; align-items:center; justify-content:center;
    font-size:13px; color:transparent; cursor:pointer;
  }
  .item.bought .check{background:var(--good); border-color:var(--good); color:var(--bg);}

  .info{flex:1; min-width:0; cursor:pointer;}
  .name{font-size:15.5px; font-weight:500; color:var(--ink);}
  .meta{
    margin-top:3px; font-family:'DM Mono',monospace; font-size:11.5px; color:var(--ink-dim);
    display:flex; flex-wrap:wrap; gap:x 8px; gap:4px 10px;
  }
  .meta span{white-space:nowrap;}
  .meta .price{color:var(--accent);}

  .del{
    background:none; border:none; color:var(--ink-faint); font-size:18px; padding:2px 4px;
    cursor:pointer; line-height:1; flex-shrink:0;
  }
  .del:active{color:var(--danger);}

  .empty{
    text-align:center; padding:60px 20px; color:var(--ink-faint);
  }
  .empty .big{font-family:'Cormorant Garamond',serif; font-style:italic; font-size:22px; color:var(--ink-dim); margin-bottom:6px;}

  /* add bar */
  .addbar{
    position:fixed; left:0; right:0; bottom:0; background:var(--paper);
    border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    z-index:10;
  }
  .addbar.expanded .row2{display:grid;}
  .row1{display:flex; gap:8px;}
  .row1 input[type=text]{flex:1;}
  input, select{
    background:var(--bg); border:1px solid var(--line); color:var(--ink);
    font-family:'DM Sans',sans-serif; font-size:14.5px; border-radius:8px; padding:11px 12px;
    outline:none; width:100%;
  }
  input:focus, select:focus{border-color:var(--accent);}
  input::placeholder{color:var(--ink-faint);}

  .row2{
    display:none; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px;
  }
  .row2 input, .row2 select{font-family:'DM Mono',monospace; font-size:13px;}
  .row2 .full{grid-column:1 / -1;}

  .addbtn{
    background:var(--accent); border:none; color:#1c1305; font-weight:700;
    border-radius:8px; padding:0 18px; font-size:20px; cursor:pointer; flex-shrink:0;
  }
  .toggle{
    text-align:center; font-size:11px; color:var(--ink-faint); letter-spacing:.08em;
    text-transform:uppercase; margin-top:8px; cursor:pointer;
  }

  .syncrow{
    display:flex; justify-content:center; align-items:center; gap:6px;
    margin-top:10px; font-family:'DM Mono',monospace; font-size:10.5px; color:var(--ink-faint);
    letter-spacing:.06em; text-transform:uppercase;
  }
  .syncrow span{cursor:pointer;}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--ink-faint); flex-shrink:0; cursor:pointer;}
  .dot.ok{background:var(--good);}
  .dot.err{background:var(--danger);}
  .dot.busy{background:var(--accent); animation:pulse 1s infinite ease-in-out;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  .gear{
    background:none; border:none; color:var(--ink-faint); font-size:13px; cursor:pointer;
    padding:2px 4px; margin-left:2px; line-height:1;
  }
  .gear:active{color:var(--accent);}

  .modal-backdrop{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.55);
    z-index:20; align-items:center; justify-content:center; padding:20px;
  }
  .modal-backdrop.open{display:flex;}
  .modal{
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:22px 20px; width:100%; max-width:360px;
  }
  .modal-title{
    font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:600;
    font-size:22px; color:var(--ink); margin-bottom:4px;
  }
  .modal-sub{font-size:12.5px; color:var(--ink-dim); margin-bottom:14px; line-height:1.4;}
  .modal input{margin-bottom:6px;}
  .modal-status{
    font-family:'DM Mono',monospace; font-size:11px; color:var(--ink-faint); min-height:16px; margin-bottom:10px;
  }
  .modal-status.err{color:var(--danger);}
  .modal-status.ok{color:var(--good);}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;}
  .mbtn{
    border-radius:8px; padding:9px 14px; font-size:13px; font-family:'DM Sans',sans-serif;
    font-weight:500; cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--ink-dim);
  }
  .mbtn.primary{background:var(--accent); border-color:var(--accent); color:#1c1305; font-weight:700;}
  .mbtn.ghost:active{border-color:var(--danger); color:var(--danger);}

  /* stock screen */
  .stock-screen{
    display:none; position:fixed; inset:0; background:var(--bg); z-index:15;
    flex-direction:column;
  }
  .stock-screen.open{display:flex;}
  .stock-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:calc(20px + env(safe-area-inset-top)) 20px 14px; border-bottom:1px solid var(--line);
  }
  .stock-title{
    font-family:'Cormorant Garamond',serif; font-style:italic; font-weight:600; font-size:24px; color:var(--ink);
  }
  .stock-sort{
    font-family:'DM Mono',monospace; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-faint); cursor:pointer;
  }
  .stock-list{flex:1; overflow-y:auto; padding:14px 20px 40px;}
  .stock-item{
    background:var(--paper); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin-bottom:8px;
  }
  .stock-row1{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .stock-name{font-size:15px; font-weight:500; color:var(--ink);}
  .stock-tally{font-family:'DM Mono',monospace; font-size:13px; color:var(--accent); flex-shrink:0;}
  .stock-row2{
    margin-top:4px; font-family:'DM Mono',monospace; font-size:11px; color:var(--ink-faint);
    display:flex; flex-wrap:wrap; gap:4px 10px;
  }
  .stock-empty{text-align:center; padding:60px 20px; color:var(--ink-faint);}
  .stock-empty .big{font-family:'Cormorant Garamond',serif; font-style:italic; font-size:20px; color:var(--ink-dim); margin-bottom:6px;}

  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body>

<header>
  <h1>Grocery</h1>
  <div class="sub">the list</div>
  <div class="tape">
    <div>
      <div class="label">Est. total</div>
      <div class="amount" id="total">$0.00</div>
    </div>
    <div class="count" id="count">0 items</div>
  </div>
  <div class="navrow">
    <span class="navlink" id="stockLink">Stock ›</span>
  </div>
  <div class="syncrow">
    <div class="dot" id="syncdot"></div>
    <span id="syncstatus">tap to set up sync</span>
    <button class="gear" id="gearBtn" aria-label="Sync settings">⚙</button>
  </div>
</header>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-title">Sync settings</div>
    <div class="modal-sub">Paste the Apps Script Web App URL for your Grocery sheet.</div>
    <input type="text" id="urlInput" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="modal-status" id="modalStatus"></div>
    <div class="modal-actions">
      <button class="mbtn ghost" id="clearBtn">Clear</button>
      <button class="mbtn ghost" id="cancelBtn">Cancel</button>
      <button class="mbtn primary" id="saveBtn">Save &amp; sync</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="editBackdrop">
  <div class="modal">
    <div class="modal-title">Edit item</div>
    <div class="modal-sub">Update the details for this item.</div>
    <input type="text" id="eName" placeholder="Item name" autocomplete="off">
    <input type="text" id="eAmount" placeholder="Amount (e.g. 2 lb)">
    <input type="text" id="eStore" placeholder="Store" list="storeList">
    <input type="number" step="0.01" id="ePrice" placeholder="Price ($)" inputmode="decimal">
    <input type="text" id="eCategory" placeholder="Category (optional)">
    <div class="modal-status" id="editStatus"></div>
    <div class="modal-actions">
      <button class="mbtn ghost" id="editDeleteBtn">Delete</button>
      <button class="mbtn ghost" id="editCancelBtn">Cancel</button>
      <button class="mbtn primary" id="editSaveBtn">Save</button>
    </div>
  </div>
</div>

<div class="stock-screen" id="stockScreen">
  <div class="stock-header">
    <span class="navlink" id="stockBack">‹ Back</span>
    <div class="stock-title">Stock</div>
    <span class="stock-sort" id="stockSort">Most bought</span>
  </div>
  <div class="stock-list" id="stockList"></div>
</div>

<main id="list"></main>

<div class="addbar" id="addbar">
  <div class="row1">
    <input type="text" id="fName" placeholder="Add an item…" autocomplete="off">
    <button class="addbtn" id="addBtn">+</button>
  </div>
  <div class="row2" id="row2">
    <input type="text" id="fAmount" placeholder="Amount (e.g. 2 lb)">
    <input type="text" id="fStore" placeholder="Store" list="storeList">
    <input type="number" step="0.01" id="fPrice" placeholder="Price ($)" inputmode="decimal">
    <input type="text" id="fCategory" placeholder="Category (optional)">
  </div>
  <datalist id="storeList"></datalist>
  <div class="toggle" id="toggle">+ details</div>
</div>

<iframe name="syncFrame" id="syncFrame" style="display:none"></iframe>
<form id="pushForm" method="POST" target="syncFrame" style="display:none">
  <input type="hidden" name="payload" id="pushPayload">
</form>

<script>
const KEY = 'grocery_items_v1';
let items = JSON.parse(localStorage.getItem(KEY) || '[]');

const listEl = document.getElementById('list');
const totalEl = document.getElementById('total');
const countEl = document.getElementById('count');
const addbar = document.getElementById('addbar');
const row2 = document.getElementById('row2');
const toggle = document.getElementById('toggle');

let expanded = false;
toggle.addEventListener('click', () => {
  expanded = !expanded;
  row2.style.display = expanded ? 'grid' : 'none';
  toggle.textContent = expanded ? '– details' : '+ details';
});

function save(){ localStorage.setItem(KEY, JSON.stringify(items)); render(); }

function render(){
  // running total: unbought items only
  const unbought = items.filter(i => !i.bought);
  const total = unbought.reduce((s,i) => s + (parseFloat(i.price)||0), 0);
  totalEl.textContent = '$' + total.toFixed(2);
  countEl.textContent = unbought.length + (unbought.length===1 ? ' item' : ' items') + (items.length>unbought.length ? ` · ${items.length-unbought.length} bought` : '');

  // update store datalist
  const stores = [...new Set(items.map(i=>i.store).filter(Boolean))];
  document.getElementById('storeList').innerHTML = stores.map(s=>`<option value="${esc(s)}">`).join('');

  if(items.length === 0){
    listEl.innerHTML = `<div class="empty"><div class="big">Nothing on the list</div>Add something below to get started.</div>`;
    return;
  }

  // group by store, "No store" last, bought items sink within group order but stay grouped
  const groups = {};
  items.forEach(i => {
    const key = i.store && i.store.trim() ? i.store.trim() : 'Unassigned';
    (groups[key] = groups[key] || []).push(i);
  });
  const storeNames = Object.keys(groups).sort((a,b) => {
    if(a==='Unassigned') return 1;
    if(b==='Unassigned') return -1;
    return a.localeCompare(b);
  });

  listEl.innerHTML = storeNames.map(store => {
    const rows = groups[store]
      .sort((a,b) => (a.bought - b.bought))
      .map(i => itemHTML(i)).join('');
    return `<div class="store-group"><div class="store-name">${esc(store)}</div>${rows}</div>`;
  }).join('');
}

function itemHTML(i){
  const metaParts = [];
  if(i.amount) metaParts.push(`<span>${esc(i.amount)}</span>`);
  if(i.category) metaParts.push(`<span>${esc(i.category)}</span>`);
  if(i.price) metaParts.push(`<span class="price">$${parseFloat(i.price).toFixed(2)}</span>`);
  return `
    <div class="item ${i.bought?'bought':''}" data-id="${i.id}">
      <div class="check" onclick="toggleBought('${i.id}')">${i.bought?'✓':''}</div>
      <div class="info" onclick="openEdit('${i.id}')">
        <div class="name">${esc(i.name)}</div>
        ${metaParts.length ? `<div class="meta">${metaParts.join('')}</div>` : ''}
      </div>
      <button class="del" onclick="removeItem('${i.id}')">×</button>
    </div>`;
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const HISTORY_KEY = 'grocery_history_v1';
let history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
function saveHistory(){ localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }

function toggleBought(id){
  const it = items.find(i=>i.id===id);
  if(!it) return;
  it.bought = !it.bought;
  if(it.bought){
    // log a purchase to history, and remember which entry so an accidental
    // uncheck can undo it cleanly rather than double counting
    const entry = {
      id: 'h_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      name: it.name, amount: it.amount, store: it.store,
      price: it.price, category: it.category,
      date: new Date().toISOString()
    };
    history.push(entry);
    it.lastHistoryId = entry.id;
    saveHistory();
  } else if(it.lastHistoryId){
    history = history.filter(h => h.id !== it.lastHistoryId);
    it.lastHistoryId = null;
    saveHistory();
  }
  save();
}
function removeItem(id){
  items = items.filter(i=>i.id!==id);
  save();
}

document.getElementById('addBtn').addEventListener('click', addItem);
document.getElementById('fName').addEventListener('keydown', e => { if(e.key==='Enter') addItem(); });

function addItem(){
  const name = document.getElementById('fName').value.trim();
  if(!name) return;
  const item = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name,
    amount: document.getElementById('fAmount').value.trim(),
    store: document.getElementById('fStore').value.trim(),
    price: document.getElementById('fPrice').value.trim(),
    category: document.getElementById('fCategory').value.trim(),
    bought: false
  };
  items.push(item);
  document.getElementById('fName').value = '';
  document.getElementById('fAmount').value = '';
  document.getElementById('fPrice').value = '';
  document.getElementById('fCategory').value = '';
  // keep store filled in for fast repeat-adds at same store
  document.getElementById('fName').focus();
  save();
}

render();

/* ---------- Google Sheets sync (Apps Script, JSONP pull / iframe-POST push) ---------- */
const URL_KEY = 'grocery_script_url';
let scriptUrl = localStorage.getItem(URL_KEY) || '';
let syncBusy = false;

const dot = document.getElementById('syncdot');
const status = document.getElementById('syncstatus');
const gearBtn = document.getElementById('gearBtn');
const backdrop = document.getElementById('modalBackdrop');
const urlInput = document.getElementById('urlInput');
const modalStatus = document.getElementById('modalStatus');
const saveBtn = document.getElementById('saveBtn');
const clearBtn = document.getElementById('clearBtn');
const cancelBtn = document.getElementById('cancelBtn');

function setStatus(state, text){
  dot.className = 'dot' + (state ? ' ' + state : '');
  status.textContent = text;
}

function updateStatusIdle(){
  if(!scriptUrl){ setStatus('', 'tap to set up sync'); return; }
  const last = localStorage.getItem('grocery_last_sync');
  setStatus('ok', last ? 'synced ' + last : 'tap to sync');
}
updateStatusIdle();

function openModal(){
  urlInput.value = scriptUrl;
  modalStatus.textContent = '';
  modalStatus.className = 'modal-status';
  backdrop.classList.add('open');
}
function closeModal(){ backdrop.classList.remove('open'); }

gearBtn.addEventListener('click', openModal);
cancelBtn.addEventListener('click', closeModal);
backdrop.addEventListener('click', e => { if(e.target === backdrop) closeModal(); });

clearBtn.addEventListener('click', () => {
  scriptUrl = '';
  localStorage.removeItem(URL_KEY);
  localStorage.removeItem('grocery_last_sync');
  urlInput.value = '';
  updateStatusIdle();
  modalStatus.className = 'modal-status';
  modalStatus.textContent = 'Cleared.';
});

saveBtn.addEventListener('click', () => {
  const val = urlInput.value.trim();
  if(!val){ modalStatus.className = 'modal-status err'; modalStatus.textContent = 'Paste a URL first.'; return; }
  scriptUrl = val;
  localStorage.setItem(URL_KEY, scriptUrl);
  modalStatus.className = 'modal-status';
  modalStatus.textContent = 'Syncing…';
  pushThenPull((ok) => {
    if(ok){
      modalStatus.className = 'modal-status ok';
      modalStatus.textContent = 'Connected and synced.';
      setTimeout(closeModal, 900);
    } else {
      modalStatus.className = 'modal-status err';
      modalStatus.textContent = 'Could not reach that URL. Check the deployment is set to "Anyone" and try again.';
    }
  });
});

// dot/status text still triggers a quick sync once a URL is already set
dot.addEventListener('click', () => { if(scriptUrl) manualSync(); else openModal(); });
status.addEventListener('click', () => { if(scriptUrl) manualSync(); else openModal(); });

function manualSync(){
  if(syncBusy || !scriptUrl) return;
  pushThenPull();
}

function pushThenPull(cb){
  syncBusy = true;
  setStatus('busy', 'syncing…');
  pushToSheet(() => {
    pullFromSheet(cb);
  });
}

function pushToSheet(onDone){
  document.getElementById('pushForm').action = scriptUrl;
  document.getElementById('pushPayload').value = JSON.stringify({ action:'push', items });
  const frame = document.getElementById('syncFrame');
  const timeout = setTimeout(() => { frame.onload = null; onDone(); }, 4000);
  frame.onload = () => { clearTimeout(timeout); frame.onload = null; onDone(); };
  document.getElementById('pushForm').submit();
}

function pullFromSheet(cb){
  const cbName = 'grocerySyncCb_' + Date.now();
  const script = document.createElement('script');
  const timeout = setTimeout(() => {
    syncBusy = false;
    setStatus('err', 'sync failed — check URL');
    if(cb) cb(false);
    cleanup();
  }, 6000);

  window[cbName] = (data) => {
    clearTimeout(timeout);
    if(data && Array.isArray(data.items)){
      items = data.items;
      save();
      const now = new Date();
      localStorage.setItem('grocery_last_sync', now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
      updateStatusIdle();
      if(cb) cb(true);
    } else {
      setStatus('err', 'sync failed — check URL');
      if(cb) cb(false);
    }
    syncBusy = false;
    cleanup();
  };

  function cleanup(){
    delete window[cbName];
    script.remove();
  }

  script.src = scriptUrl + '?action=pull&callback=' + cbName;
  script.onerror = () => {
    clearTimeout(timeout);
    syncBusy = false;
    setStatus('err', 'sync failed — check URL');
    if(cb) cb(false);
    cleanup();
  };
  document.body.appendChild(script);
}

// service worker lives in sw.js, next to this file, so the app installs
// and opens offline. All data lives in localStorage regardless, so offline
// just means "no sync" — add, check off, and remove all keep working with
// no connection at all.
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* ---------- Edit item ---------- */
const editBackdrop = document.getElementById('editBackdrop');
const eName = document.getElementById('eName');
const eAmount = document.getElementById('eAmount');
const eStore = document.getElementById('eStore');
const ePrice = document.getElementById('ePrice');
const eCategory = document.getElementById('eCategory');
const editStatus = document.getElementById('editStatus');
let editingId = null;

function openEdit(id){
  const it = items.find(i => i.id === id);
  if(!it) return;
  editingId = id;
  eName.value = it.name || '';
  eAmount.value = it.amount || '';
  eStore.value = it.store || '';
  ePrice.value = it.price || '';
  eCategory.value = it.category || '';
  editStatus.textContent = '';
  editBackdrop.classList.add('open');
}
function closeEdit(){ editBackdrop.classList.remove('open'); editingId = null; }

document.getElementById('editCancelBtn').addEventListener('click', closeEdit);
editBackdrop.addEventListener('click', e => { if(e.target === editBackdrop) closeEdit(); });

document.getElementById('editSaveBtn').addEventListener('click', () => {
  const it = items.find(i => i.id === editingId);
  if(!it) return;
  const name = eName.value.trim();
  if(!name){ editStatus.className = 'modal-status err'; editStatus.textContent = 'Name can\'t be empty.'; return; }
  it.name = name;
  it.amount = eAmount.value.trim();
  it.store = eStore.value.trim();
  it.price = ePrice.value.trim();
  it.category = eCategory.value.trim();
  save();
  closeEdit();
});

document.getElementById('editDeleteBtn').addEventListener('click', () => {
  if(!editingId) return;
  removeItem(editingId);
  closeEdit();
});

/* ---------- Stock: tally of everything ever purchased ---------- */
const stockScreen = document.getElementById('stockScreen');
const stockList = document.getElementById('stockList');
const stockSort = document.getElementById('stockSort');
let stockSortMode = 'count'; // 'count' or 'recent'

document.getElementById('stockLink').addEventListener('click', () => {
  renderStock();
  stockScreen.classList.add('open');
});
document.getElementById('stockBack').addEventListener('click', () => {
  stockScreen.classList.remove('open');
});
stockSort.addEventListener('click', () => {
  stockSortMode = stockSortMode === 'count' ? 'recent' : 'count';
  stockSort.textContent = stockSortMode === 'count' ? 'Most bought' : 'Most recent';
  renderStock();
});

function renderStock(){
  if(history.length === 0){
    stockList.innerHTML = `<div class="stock-empty"><div class="big">No purchases yet</div>Check items off the list and they'll show up here.</div>`;
    return;
  }

  const groups = {};
  history.forEach(h => {
    const key = (h.name || '').trim().toLowerCase();
    if(!key) return;
    if(!groups[key]) groups[key] = { name: h.name.trim(), entries: [] };
    groups[key].entries.push(h);
  });

  let list = Object.values(groups).map(g => {
    const entries = g.entries.slice().sort((a,b) => new Date(b.date) - new Date(a.date));
    const count = entries.length;
    const last = entries[0];
    const prices = entries.map(e => parseFloat(e.price)).filter(p => !isNaN(p));
    const avgPrice = prices.length ? (prices.reduce((s,p)=>s+p,0) / prices.length) : null;
    const storeCounts = {};
    entries.forEach(e => { if(e.store) storeCounts[e.store] = (storeCounts[e.store]||0) + 1; });
    const topStore = Object.keys(storeCounts).sort((a,b) => storeCounts[b]-storeCounts[a])[0];
    return { name: g.name, count, lastDate: last.date, avgPrice, topStore };
  });

  list.sort((a,b) => stockSortMode === 'count'
    ? (b.count - a.count) || a.name.localeCompare(b.name)
    : new Date(b.lastDate) - new Date(a.lastDate));

  stockList.innerHTML = list.map(s => {
    const dateStr = new Date(s.lastDate).toLocaleDateString([], {month:'short', day:'numeric'});
    const bits = [`<span>last ${dateStr}</span>`];
    if(s.topStore) bits.push(`<span>${esc(s.topStore)}</span>`);
    if(s.avgPrice !== null) bits.push(`<span>avg $${s.avgPrice.toFixed(2)}</span>`);
    return `
      <div class="stock-item">
        <div class="stock-row1">
          <div class="stock-name">${esc(s.name)}</div>
          <div class="stock-tally">×${s.count}</div>
        </div>
        <div class="stock-row2">${bits.join('')}</div>
      </div>`;
  }).join('');
}
